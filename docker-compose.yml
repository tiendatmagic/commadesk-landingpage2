services:
  commadesk-landingpage:
    build:
      context: .
      dockerfile: Dockerfile
    image: commadesk-landingpage:latest
    container_name: commadesk-landingpage
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
